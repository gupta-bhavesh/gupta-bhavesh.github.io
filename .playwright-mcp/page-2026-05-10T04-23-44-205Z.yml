      - generic [ref=e17]: Systems · GPUs · LLMs
      - heading "The Hardware Story Behind LLMs" [level=1] [ref=e18]:
        - text: The
        - emphasis [ref=e19]: Hardware Story
        - text: Behind LLMs
      - paragraph [ref=e20]: Why GPUs run LLMs and CPUs don't — a ground-up tour of the silicon, the memory hierarchy, and the data movement problem at the heart of every model.
      - generic [ref=e21]:
        - generic [ref=e22]: reading · 19 min
        - generic [ref=e23]: origin · Medium · 2026-05-01
    - article [ref=e24]:
      - generic [ref=e25]:
        - generic [ref=e26]:
          - generic [ref=e27]: § 01 — Why this post
          - heading "From models down to silicon" [level=2] [ref=e28]
          - paragraph [ref=e29]:
            - text: "I started learning LLMs from the top — prompts, context windows, agents — and kept running into the same wall:"
            - emphasis [ref=e30]: why is this slow, why is it expensive, why can't it run on my laptop
            - text: . Each answer pointed lower. Inference is a memory problem. Memory is a GPU problem. GPUs make sense only when you understand why CPUs fall short.
          - paragraph [ref=e31]:
            - text: "This post is the bottom-up version of that journey. We start with the difference between CPUs and GPUs, walk through the memory tower, and end at the punchline:"
            - strong [ref=e32]: modern LLM inference is bottlenecked by data movement, not arithmetic
            - text: . That single sentence explains nearly every optimization in the ecosystem.
        - generic [ref=e33]:
          - generic [ref=e34]: § 02 — Two philosophies
          - heading "CPUs vs GPUs" [level=2] [ref=e35]
          - paragraph [ref=e36]: CPUs and GPUs are both made of transistors, but they are designed for opposite workloads. A CPU is built to make smart decisions quickly. A GPU is built to do massive amounts of dumb arithmetic in parallel.
          - heading "The CPU Way" [level=3] [ref=e37]
          - paragraph [ref=e38]:
            - text: CPUs have a
            - strong [ref=e39]: few powerful cores
            - text: "— usually 8 to 64 — each with deep machinery: branch predictors, out-of-order execution, large multi-level caches. Every core can hold a complex chain of conditionals in its head and follow whichever branch comes up. They're optimised for unpredictable, branchy work where the next instruction depends on the last one's result."
          - heading "The GPU Way" [level=3] [ref=e40]
          - paragraph [ref=e41]:
            - text: GPUs invert this. An NVIDIA RTX 4090 has
            - strong [ref=e42]: over 16,000 simple CUDA cores
            - text: ". They share machinery: one branch predictor per group, one instruction stream per group, one register file. Each core individually is dumb. Together they execute the same instruction on different data simultaneously — a model called"
            - strong [ref=e43]: SIMT (Single Instruction, Multiple Threads)
            - text: .
          - generic [ref=e44]:
            - generic [ref=e45]: The trade
            - paragraph [ref=e47]: CPUs spend silicon on cleverness. GPUs spend silicon on parallelism. If your work looks like the same operation repeated billions of times — matrix multiplication is the canonical example — GPUs will absolutely demolish CPUs.
