          - paragraph [ref=e188]: "A useful analogy: registers are your hands, SRAM is your desk, VRAM is a nearby bookshelf, RAM is a bookshelf in another room, and disk is the warehouse downstairs. Every step down the tower is roughly an order of magnitude slower and an order of magnitude bigger."
          - generic [ref=e189]:
            - generic [ref=e190]: The optimisation game
            - paragraph [ref=e192]: The whole game of high-performance computing is to keep your working set as high up the tower as possible for as long as possible. FlashAttention does it inside an attention kernel. vLLM does it across a request batch. Quantization makes the working set smaller so more of it fits.
        - generic [ref=e193]:
          - generic [ref=e194]: § 07 — Inference end to end
          - heading "What happens when you call an LLM" [level=2] [ref=e195]
          - paragraph [ref=e196]: "With the hardware in mind, here is what actually happens when you send a prompt to a model:"
          - generic [ref=e197]: "# 1. Cold start (one time) Disk → CPU RAM → GPU VRAM: load 70B × 2 bytes ≈ 140 GB of weights # 2. Per request CPU: tokenize text → list of ints (small, branchy) CPU → GPU: PCIe transfer of int tokens (tiny) GPU: embedding lookup → vectors (memory load) GPU: N transformer layers, each: - attention (Q, K, V, softmax, output) - feed-forward (two matmuls + activation) GPU: final projection → logits over vocabulary GPU: sample next token ↻ KV cache reused so prior tokens not recomputed"
          - heading "The KV Cache" [level=3] [ref=e198]
          - paragraph [ref=e199]:
            - text: For autoregressive generation, attention at step t needs the keys and values of every previous token. Recomputing them would cost O(N²) work per token. Instead the keys and values are
            - strong [ref=e200]: cached in VRAM
            - text: "— the famous KV cache. It is why context length is expensive: cache size grows linearly with sequence length and quickly dominates VRAM."
        - generic [ref=e201]:
          - generic [ref=e202]: § 08 — The punchline
          - heading "The Memory-Bandwidth Bottleneck" [level=2] [ref=e203]
          - paragraph [ref=e204]: "Here is the key fact that changed how I read every LLM systems paper:"
          - generic [ref=e205]:
            - generic [ref=e206]: The truth
            - paragraph [ref=e208]:
              - strong [ref=e209]: Modern LLM inference is bottlenecked by memory bandwidth, not by compute.
              - text: Tensor Cores can do far more arithmetic per second than the memory bus can feed them. They sit waiting for weights and KV cache data to arrive from VRAM into SRAM.
          - paragraph [ref=e210]:
            - text: For a single decoding step on a 70B model in fp16, the GPU must stream all 140 GB of weights from HBM through SRAM to the cores — every single token. A H100 with 3.35 TB/s of HBM bandwidth gives a hard ceiling of about
            - strong [ref=e211]: 24 tokens / second per user
            - text: ", no matter how many flops the chip technically has."
          - generic [ref=e212]:
            - generic [ref=e213]:
              - generic [ref=e214]: 3 TB/s
              - generic [ref=e215]: A100 / H100 HBM bandwidth
            - generic [ref=e216]:
              - generic [ref=e217]: 312 TFLOP/s
              - generic [ref=e218]: A100 fp16 compute (Tensor Cores)
            - generic [ref=e219]:
              - generic [ref=e220]: ~10×
              - generic [ref=e221]: compute-to-bandwidth gap that LLMs hit
          - heading "This single fact explains the optimisation ecosystem" [level=3] [ref=e222]
          - paragraph [ref=e223]: "Once you see the bottleneck is data movement, everything else clicks:"
          - table [ref=e225]:
            - rowgroup [ref=e226]:
