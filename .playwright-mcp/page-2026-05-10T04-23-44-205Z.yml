                - cell "Squeezes the working set into CPU RAM bandwidth" [ref=e251]
          - paragraph [ref=e252]:
            - text: "All of these answer the same question:"
            - emphasis [ref=e253]: how do we move less data, or move it less often?
            - text: Compute is rarely the problem.
        - generic [ref=e254]:
          - generic [ref=e255]: § 09 — Closing
          - heading "LLMs are a data-movement problem" [level=2] [ref=e256]
          - paragraph [ref=e257]: "If you remember one thing from this post: don't think of an LLM as a math problem. Think of it as a data movement problem. Billions of weights need to flow from VRAM into the cores, and the speed of that flow — not the cleverness of the math — sets the wall."
          - paragraph [ref=e258]:
            - text: "Once that frame is in your head, the entire optimization stack reads as one coherent strategy. FlashAttention, paged attention, quantization, speculative decoding, NVLink, HBM3e, ring attention — all of them are different ways of saying:"
            - emphasis [ref=e259]: move less, or move it once
            - text: .
          - paragraph [ref=e260]: That's also why the next post in this series is on FlashAttention specifically — the cleanest example of this idea, applied to the most expensive operation in a transformer.
