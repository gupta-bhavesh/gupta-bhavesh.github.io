              - row "Registers (per thread) Fastest Bytes" [ref=e111]:
                - cell "Registers (per thread)" [ref=e112]
                - cell "Fastest" [ref=e113]
                - cell "Bytes" [ref=e114]
          - paragraph [ref=e115]:
            - text: HBM uses 3D stacking — multiple memory dies stacked vertically next to the GPU on the same package — which is what makes those tera-byte-per-second numbers possible. But notice GPU VRAM is optimised for
            - strong [ref=e116]: throughput
            - text: not latency. It's slow to fetch one value, fast to fetch a million.
        - generic [ref=e117]:
          - generic [ref=e118]: § 04 — Where GPUs lose
          - heading "GPU Weaknesses" [level=2] [ref=e119]
          - paragraph [ref=e120]: "GPUs aren't magic. They are bad at exactly the things CPUs are good at:"
          - list [ref=e121]:
            - listitem [ref=e122]:
              - strong [ref=e123]: Branchy code
              - text: — divergent paths halve effective parallelism
            - listitem [ref=e124]:
              - strong [ref=e125]: Sequential dependencies
              - text: — anything that needs the previous step's result before continuing
            - listitem [ref=e126]:
              - strong [ref=e127]: Tiny workloads
              - text: — kernel launch overhead dominates the work itself
            - listitem [ref=e128]:
              - strong [ref=e129]: Irregular memory access
              - text: — pointer chasing defeats memory coalescing and you pay full latency for every fetch
          - paragraph [ref=e130]: This is why we don't run operating systems on GPUs. It's also why pre-processing (tokenization, sampling, control flow) still happens on the CPU even when the model is on the GPU.
        - generic [ref=e131]:
          - generic [ref=e132]: § 05 — Matrix multiply
          - heading "The canonical GPU problem" [level=2] [ref=e133]
          - paragraph [ref=e134]:
            - text: Matrix multiplication is the operation that makes deep learning interesting and makes GPUs essential. Computing
            - code [ref=e135]: C = A × B
            - text: for an N×N matrix requires N² output cells, and each output cell is an independent dot product of one row of A with one column of B.
          - generic [ref=e136]:
            - generic [ref=e137]: The parallel decomposition
            - generic [ref=e139]: C = A × B (each cell is independent) B (cols) ┌──┬──┬──┐ │ │ │ │ └──┴──┴──┘ A (rows) ┌──┐ C │ │ ┌──┬──┬──┐ ├──┤ │ ?│ ?│ ?│ ← N² independent │ │ ├──┼──┼──┤ dot products, └──┘ └──┴──┴──┘ one per thread
          - paragraph [ref=e140]:
            - text: On a CPU you'd write three nested loops and distribute the outer one over your 8 cores. On a GPU you launch
            - strong [ref=e141]: N² threads
            - text: ", each computing one output cell. Tensor Cores then crunch each dot product as fused multiply-adds. The work scales effortlessly with the size of the GPU."
          - paragraph [ref=e142]: Every layer of a transformer is a stack of matrix multiplies (Q@Kᵀ, attention@V, the two MLP projections). The whole model is shaped like this on purpose — to look exactly like the workload GPUs are best at.
        - generic [ref=e143]:
          - generic [ref=e144]: § 06 — The tower
          - heading "The Memory Hierarchy" [level=2] [ref=e145]
          - paragraph [ref=e146]:
            - text: Performance in modern computing is never about how fast the cores are. It's about how fast you can
            - emphasis [ref=e147]: feed them
            - text: ". Memory exists in a tower with a brutal speed-vs-capacity tradeoff:"
          - complementary [ref=e148]:
            - generic [ref=e149]:
