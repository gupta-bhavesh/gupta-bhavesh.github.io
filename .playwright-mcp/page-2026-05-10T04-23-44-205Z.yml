                - cell "8 – 24 GB" [ref=e102]
              - row "Data-center GPU VRAM (HBM) 2 – 3 TB/s 40 – 80 GB" [ref=e103]:
                - cell "Data-center GPU VRAM (HBM)" [ref=e104]
                - cell "2 – 3 TB/s" [ref=e105]
                - cell "40 – 80 GB" [ref=e106]
              - row "SM SRAM (shared / scratchpad) ~19 TB/s ~164 KB per SM" [ref=e107]:
                - cell "SM SRAM (shared / scratchpad)" [ref=e108]
                - cell "~19 TB/s" [ref=e109]
