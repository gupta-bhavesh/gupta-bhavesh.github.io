        - generic [ref=e76]:
          - generic [ref=e77]: § 03 — Inside a GPU
          - heading "Warps, SMs, Tensor Cores" [level=2] [ref=e78]
          - 'heading "Warps: The Lockstep Squad" [level=3] [ref=e79]'
          - paragraph [ref=e80]:
            - text: GPUs organise their cores into groups of
            - strong [ref=e81]: 32 threads called warps
            - text: . All 32 threads in a warp execute the same instruction at the same time, on different data. This shared instruction stream is what lets the GPU skip the redundant hardware that CPUs need (32 branch predictors per warp would be wasteful when one suffices).
          - paragraph [ref=e82]:
            - text: "The catch: when threads in a warp need to take different paths — some take the"
            - code [ref=e83]: if
            - text: ", others take the"
            - code [ref=e84]: else
            - text: — the hardware must execute both paths sequentially. This is called
            - strong [ref=e85]: warp divergence
            - text: and it cuts parallelism in half. It's why "branchy" code on a GPU feels like the GPU got worse, not better.
          - heading "SMs and Tensor Cores" [level=3] [ref=e86]
          - paragraph [ref=e87]:
            - text: Warps live on
            - strong [ref=e88]: Streaming Multiprocessors (SMs)
            - text: . An A100 has 108 SMs. Each SM has its own pool of registers, its own scratchpad memory (SRAM), and its own scheduler. Inside each SM live the
            - strong [ref=e89]: Tensor Cores
            - text: — specialized hardware that fuses a multiply and an add into a single instruction operating on small matrices. They are the reason matrix multiplication is so fast.
          - heading "Memory Inside a GPU" [level=3] [ref=e90]
          - table [ref=e92]:
            - rowgroup [ref=e93]:
              - row "Memory Bandwidth Capacity" [ref=e94]:
                - columnheader "Memory" [ref=e95]
                - columnheader "Bandwidth" [ref=e96]
