            - text: The masked tiles — roughly half of all tiles — are
            - strong [ref=e289]: skipped completely
            - text: . No K,V loaded from HBM, no matmul, no softmax update. For a model with N=1024 and block size 64, this eliminates ~112 of 256 tiles. Causal attention with FA2 is approximately
