          - generic [ref=e206]:
            - generic [ref=e207]: FA1's Contribution
            - paragraph [ref=e209]: FA1 proved that exact attention can be computed without the N×N matrix ever existing in memory. This was the foundational insight. But profiling showed GPUs were still only at 25–40% utilization. The memory problem was solved — but the computation was still inefficient.
        - generic [ref=e210]:
          - generic [ref=e211]: § 05 — FlashAttention 2
          - 'heading "FlashAttention 2: GPU-Optimal Attention" [level=2] [ref=e212]':
            - text: "FlashAttention 2:"
            - text: GPU-Optimal Attention
          - paragraph [ref=e213]:
            - text: FlashAttention 2 (Dao, 2023) keeps the same online softmax tiling from FA1 but fundamentally restructures
            - emphasis [ref=e214]: how
            - text: that computation maps onto GPU hardware. Three specific inefficiencies in FA1 are identified and fixed.
          - generic [ref=e215]:
            - generic [ref=e216]: Improvement 01
            - generic [ref=e217]: Swap the Loop Order — Outer Q, Inner K,V
            - generic [ref=e218]:
              - paragraph [ref=e219]:
                - text: In FA1, the outer loop iterates over K,V blocks and the inner loop over Q blocks. This means for each K,V block,
                - emphasis [ref=e220]: every
                - text: Q block must be loaded from HBM, used, and written back. A Q block with N=1024 and 16 K,V blocks gets loaded from HBM 16 times.
              - paragraph [ref=e221]: "FA2 flips the loops: outer over Q, inner over K,V."
              - generic [ref=e222]: "for each Q_i block (outer): # FA2: Q is fixed in outer loop Load Q_i into SRAM — stays here for each K_j, V_j block (inner): # K,V cycle in and out Load K_j, V_j into SRAM Update m, ℓ, O in SRAM # all state stays in SRAM Discard K_j, V_j Write final O_i to HBM once # one write at the very end"
              - paragraph [ref=e223]: Now Q is loaded once per block. Its running state (m, ℓ, O) stays warm in SRAM throughout the entire inner loop — never flushed to HBM. K and V cycle in and out cheaply since they carry no accumulated state.
              - generic [ref=e224]: "# HBM reads for Q blocks: FA1: 16 Q blocks × 16 K iterations = 256 reads FA2: 16 Q blocks × 1 (loaded once) = 16 reads ← 16× fewer"
          - generic [ref=e225]:
            - generic [ref=e226]: Improvement 02
            - generic [ref=e227]: Parallelize Over Sequence Length
            - generic [ref=e228]:
              - paragraph [ref=e229]: FA1 launched one thread block per (batch item, attention head). So total parallel work = batch size × number of heads. During inference with batch=1 and 8 heads, only 8 SMs work out of 108 — 93% of the GPU sits idle.
              - paragraph [ref=e230]:
                - text: "FA2 adds a third dimension: it launches one thread block per (batch item, head,"
                - strong [ref=e231]: Q block
                - text: ).
              - generic [ref=e232]: "# Parallel thread blocks: FA1: batch × heads = 1 × 8 = 8 blocks (8 SMs busy) FA2: batch × heads × Qblocks = 1 × 8 × 16 = 128 blocks (all 108 SMs busy)"
              - paragraph [ref=e233]: This is safe because different Q blocks produce completely independent output rows — they all read K,V (read-only, no conflicts) but write to entirely different parts of the output matrix O. No coordination needed between SMs.
              - paragraph [ref=e234]: Critically, this scales with sequence length. As context windows grow from 2k to 128k tokens, FA2's utilization stays high. FA1's utilization was unchanged regardless of sequence length.
          - generic [ref=e235]:
            - generic [ref=e236]: Improvement 03
            - generic [ref=e237]: Warp-Level Independence — No Sync Barriers
            - generic [ref=e238]:
              - paragraph [ref=e239]: "Inside a single SM, work is divided among warps (groups of 32 threads). FA1 assigned different warps to different K,V blocks:"
              - generic [ref=e240]: "# FA1: warps split over K,V (causes sync) Warp 1 → computes scores from K₁ ──┐ Warp 2 → computes scores from K₂ ──┼──► must combine for softmax Warp 3 → computes scores from K₃ ──┘ SYNC BARRIER — all wait # FA2: warps split over Q rows (no sync needed) Warp 1 → rows 1–16 of Q block → sweeps all K,V independently Warp 2 → rows 17–32 of Q block → sweeps all K,V independently Warp 3 → rows 33–48 of Q block → sweeps all K,V independently Warp 4 → rows 49–64 of Q block → sweeps all K,V independently"
              - paragraph [ref=e241]: In FA2, each warp maintains its own private m, ℓ, O for its rows. It never needs any other warp's values. No sync required.
              - paragraph [ref=e242]:
                - text: "Why does sync hurt so much? GPUs hide memory latency by switching between warps — when one warp waits for data, another runs. A sync barrier kills this:"
                - emphasis [ref=e243]: all
                - text: warps must freeze simultaneously. The SM has nothing to run, Tensor Cores go idle, and the GPU wastes its 312 TFLOP/s capacity.
          - heading "The FA2 Forward Pass" [level=3] [ref=e244]
          - paragraph [ref=e245]: "All three improvements combine into this loop structure:"
          - generic [ref=e246]: "# One thread block per (batch, head, Q_i block) # Each thread block runs on one SM # Warps within SM handle different row slices of Q_i Load Q_i block into SRAM # once, stays here Initialize O = 0, ℓ = 0, m = −∞ # running state in SRAM for j = 1 to T_c: # iterate over all K,V blocks Load K_j, V_j into SRAM S_j = Q_i @ K_jᵀ / sqrt(d) # [Br × Bc] — Tensor Cores m_new = max(m, rowmax(S_j)) # update running max P_j = exp(S_j − m_new) # unnormalized weights ℓ_new = exp(m − m_new) × ℓ + rowsum(P_j) O = exp(m − m_new) × O + P_j @ V_j m = m_new, ℓ = ℓ_new # carry state forward in SRAM O_final = O / ℓ # normalize Write O_final to HBM # one write to slow memory"
          - heading "Results" [level=3] [ref=e247]
