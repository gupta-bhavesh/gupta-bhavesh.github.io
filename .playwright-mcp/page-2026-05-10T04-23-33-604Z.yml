          - generic [ref=e157]: § 04 — FlashAttention 1
          - 'heading "FlashAttention 1: Tiling Attention" [level=2] [ref=e158]':
            - text: "FlashAttention 1:"
            - text: Tiling Attention
          - paragraph [ref=e159]: FlashAttention 1 (Dao et al., 2022) combines the online softmax algorithm with a tiled computation strategy to compute exact attention without ever materializing the N×N matrix in HBM.
          - heading "Tiling the Matrices" [level=3] [ref=e160]
          - paragraph [ref=e161]:
            - text: Q, K, V each have shape
            - strong [ref=e162]: "[N × d]"
            - text: "where N is sequence length and d is head dimension. FlashAttention slices them into horizontal strips — chunks of rows — that fit in SRAM:"
          - generic [ref=e163]: "# Example: N=1024, d=128, block size Br=Bc=64 Q [1024 × 128] K [1024 × 128] V [1024 × 128] ┌────────────┐ ┌────────────┐ ┌────────────┐ │ Q₁ [64×128]│ │ K₁ [64×128]│ │ V₁ [64×128]│ ├────────────┤ ├────────────┤ ├────────────┤ │ Q₂ [64×128]│ │ K₂ [64×128]│ │ V₂ [64×128]│ ├────────────┤ ├────────────┤ ├────────────┤ │ ... │ │ ... │ │ ... │ └────────────┘ └────────────┘ └────────────┘ 16 blocks 16 blocks 16 blocks"
          - paragraph [ref=e164]:
            - text: Block sizes B
            - subscript [ref=e165]: r
            - text: and B
            - subscript [ref=e166]: c
            - text: "are chosen so that one Q block + one K block + one V block + one O block all fit within a single SM's 164 KB SRAM. For the example above:"
          - generic [ref=e167]: "# SRAM usage per tile (fp16 = 2 bytes per number) Q block : 64 × 128 × 2 = 16 KB K block : 64 × 128 × 2 = 16 KB V block : 64 × 128 × 2 = 16 KB O block : 64 × 128 × 2 = 16 KB S tile : 64 × 64 × 2 = 8 KB (temporary scores) ───────────────────────────── Total : 72 KB ✓ fits in 164 KB"
          - complementary [ref=e168]:
            - generic [ref=e169]:
              - generic [ref=e170]: Interactive Visual
              - link "open full screen ↗" [ref=e171] [cursor=pointer]:
                - /url: /visuals/attention-tiling
            - heading "Attention Tiling — interactive" [level=4] [ref=e172]
            - paragraph [ref=e173]: Step through how FA1 sweeps tiles across Q, K, V. Adjust block size and sequence length, watch the running m, ℓ, O state update tile by tile.
          - heading "The FA1 Forward Pass Algorithm" [level=3] [ref=e174]
          - paragraph [ref=e175]: "FA1's loop iterates with K,V as the outer loop and Q as the inner loop:"
          - generic [ref=e176]: "for each K_j, V_j block (outer loop): # iterate K,V Load K_j, V_j into SRAM for each Q_i block (inner loop): # iterate Q Load Q_i into SRAM S_j = Q_i @ K_jᵀ / sqrt(d) # scores [Br × Bc] m_new = max(m_i, rowmax(S_j)) ℓ_new = exp(m_i − m_new) × ℓ_i + rowsum(exp(S_j − m_new)) O_i = exp(m_i − m_new) × O_i + exp(S_j − m_new) @ V_j Write updated m_i, ℓ_i, O_i back to HBM final: O_i = O_i / ℓ_i # normalize"
