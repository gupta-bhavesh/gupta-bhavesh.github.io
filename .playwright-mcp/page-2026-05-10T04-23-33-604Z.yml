          - generic [ref=e374]: § 09 — Takeaway
          - heading "The Bigger Picture" [level=2] [ref=e375]
          - paragraph [ref=e376]:
            - text: FlashAttention is a masterclass in the difference between algorithmic complexity and practical performance. Standard attention, FA1, and FA2 all compute the
            - strong [ref=e377]: exact same mathematical operation
            - text: . The difference is entirely in how that computation maps onto hardware.
          - paragraph [ref=e378]: "FA1's contribution was conceptual: prove that exact attention doesn't require storing N×N in memory. The online softmax trick made tiling possible. This unlocked long-context training that was previously impossible."
          - paragraph [ref=e379]: "FA2's contribution was engineering: given that we're tiling, how do we make the GPU as efficient as possible? Flip the loop order to keep Q's state in SRAM. Launch more thread blocks to use all SMs. Split warps over Q rows to eliminate sync barriers. Three targeted fixes that doubled throughput."
          - generic [ref=e380]:
            - generic [ref=e381]: The Core Lesson
            - paragraph [ref=e383]: Modern deep learning is memory-bandwidth bound, not compute-bound. The GPU has far more FLOPs available than the memory bus can feed. The algorithms that win are those that minimize HBM round trips and keep data in fast on-chip SRAM as long as possible. FlashAttention is the canonical example of this principle applied to the most expensive operation in a transformer.
          - paragraph [ref=e384]: FA3 (2024) continues this thread — targeting Hopper architecture (H100) with asynchronous memory pipelines and FP8 support, pushing utilization even further. The algorithmic ideas remain the same; the hardware-aware optimization goes deeper.
          - paragraph [ref=e385]:
            - text: "If you want to go further: the original FA1 paper ("
            - emphasis [ref=e386]: Dao et al., NeurIPS 2022
            - text: ) and FA2 paper (
            - emphasis [ref=e387]: Dao, 2023, arXiv:2307.08691
            - text: ) are both readable and worth the time. The FA2 paper in particular is concise and the pseudocode maps directly to the explanation above.
