          - generic [ref=e293]: § 07 — Backward Pass
          - 'heading "Backward Pass: Recomputation" [level=2] [ref=e294]':
            - text: "Backward Pass:"
            - text: Recomputation
          - paragraph [ref=e295]: Training requires backpropagation — computing gradients of the loss with respect to Q, K, V. Standard attention saves the full N×N attention probability matrix P during the forward pass and reads it back during backprop to compute gradients.
          - paragraph [ref=e296]: FA2 never stores P — it's discarded after each tile. So how does backprop work?
          - 'heading "The Solution: Recompute on the Fly" [level=3] [ref=e297]'
          - paragraph [ref=e298]: "FA2 saves only the minimal state needed after the forward pass:"
          - generic [ref=e299]: "# FA2 saves after forward pass: Q, K, V # the inputs (needed anyway) O # the output m # running max per row — one scalar per token ℓ # running sum per row — one scalar per token # NOT saved: P # the N×N attention matrix — thrown away"
          - paragraph [ref=e300]:
            - text: During the backward pass, FA2 recomputes the attention tiles P
            - subscript [ref=e301]: j
            - text: on the fly — running the same tiling algorithm from the forward pass — and immediately uses them to compute gradients before discarding again.
          - heading "Is Recomputation Worth It?" [level=3] [ref=e302]
          - paragraph [ref=e303]: Intuition says extra computation must be slower. But the bottleneck is memory bandwidth, not compute. Recomputing P tiles in SRAM using fast Tensor Core matmuls is much cheaper than loading a huge P matrix from slow HBM.
          - generic [ref=e304]: "# Recomputing one tile P_j [64×64]: = one matmul: Q_block @ K_blockᵀ = 64 × 64 × 128 × 2 FLOPs = ~1M FLOPs → microseconds on Tensor Cores ✓ fast # Loading full P [N×N] from HBM (N=4096): = 4096 × 4096 × 2 bytes = 32 MB read from HBM → bottlenecked by ~2 TB/s bandwidth ✗ slow"
          - heading "The Memory Saving is What Makes Long Context Possible" [level=3] [ref=e305]
          - generic [ref=e306]: "# Standard attention memory during training (GPT-4 scale estimate): P matrix per layer per head = N² × 2 bytes N=8192, 32 heads, 96 layers: = 8192² × 2 × 32 × 96 ≈ 412 GB ← physically impossible # FA2 memory during training: Saves only m, ℓ per token = 2 × N × 4 bytes N=8192, 32 heads, 96 layers: = 2 × 8192 × 4 × 32 × 96 ≈ 200 MB ← trivial"
          - generic [ref=e307]:
            - generic [ref=e308]: Why This Matters
            - paragraph [ref=e310]: FA2's recomputation trick is what makes training on 32k, 128k, and million-token context windows physically feasible. Without it, the memory requirements for storing attention matrices across all heads and layers exceed the capacity of any current GPU.
